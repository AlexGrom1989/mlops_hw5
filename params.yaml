# Единственная точка конфигурации ДЗ 5. В src/ нет ни имени модели,
# ни learning rate, ни путей.
model:
  name: "Qwen/Qwen3-0.6B"
  device: "cpu"             # auto | cpu | cuda | mps
  # Базовые веса в bfloat16: они заморожены, точность им не нужна, а память
  # и время уходят вдвое. Сами матрицы LoRA peft держит в float32 — там идут
  # крошечные обновления AdamW. На старом CPU без bf16 ставьте float32.
  # Здесь именно такой случай: AVX2 без AVX-512 и без аппаратного bf16,
  # bfloat16 эмулировался бы и шёл медленнее float32.
  dtype: "float32"
  enable_thinking: false    # как в ДЗ 4: шаблон должен совпадать с обучением

data:
  # Выход стадии tokenize из ДЗ 4. У студента — свой путь.
  train: "data/tokenized/train.pt"
  val: "data/tokenized/val.pt"

lora:
  r: 8
  alpha: 16                 # итоговый масштаб апдейта alpha / r = 2
  dropout: 0.05
  # Только проекции внимания и MLP. embed_tokens и lm_head — это 155 млн
  # параметров каждый; в modules_to_save они уезжают в адаптер целиком.
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

train:
  seed: 42
  epochs: 1
  batch_size: 2
  grad_accum: 4             # эффективный батч = 8: память как у батча 2, шаг как у батча 8
  # 2e-4 — рабочий порядок для LoRA. 1e-2 не даёт NaN и адаптер сохраняется
  # как обычно: train loss просто взлетает до десятков и остаётся выше, чем
  # был до обучения. Правду про такой прогон скажет только val loss.
  lr: 2.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  eval_every: 10            # шагов оптимизатора между замерами val loss
  # Оценка на этом железе стоит 1,06 с на пример: полный val из 600 примеров —
  # 10,6 мин на ОДИН замер, то есть больше часа только на кривую. Берём первые
  # 96 примеров — одни и те же для обоих вариантов и всех прогонов, поэтому
  # числа сравнимы между собой. null — считать по всему val.
  val_limit: 96
  # Логиты на весь словарь: 2 примера x 512 токенов x 151 936 x 4 байта = 0,6 ГБ.
  # Батч 8 на оценке — уже 2,5 ГБ одних логитов, и ноутбук уходит в своп.
  eval_batch_size: 2
  gradient_checkpointing: true   # без него на ноутбуке с 16–32 ГБ не влезает
  # null — по эпохам; число — обрезать. Машина без GPU: обучение стоит
  # 4,63 с на пример, полная эпоха по 4797 примерам из ДЗ 4 — 6,2 ч на вариант
  # и 12,4 ч на оба. 60 шагов оптимизатора при эффективном батче 8 — это
  # 480 примеров, примерно размер курсового среза, и 37 мин на вариант.
  # Основное падение loss всё равно происходит в первых шагах.
  max_steps: 60

# Эксперимент по слоям: второй прогон без адаптеров на первых N слоях.
variants:
  - name: "all_layers"
    freeze_first: 0
  - name: "freeze14"
    freeze_first: 14

compare:
  # Отзыв в датасете медианно 77 токенов: на 40 обрывается на полуслове
  # и сравнивать нечего. 120 хватает на целый отзыв, и это 5 промптов x
  # 2 модели x 120 токенов генерации — пара минут на CPU.
  max_new_tokens: 120
  # Пять фиксированных промптов: одни и те же для базовой модели и адаптера.
  # Карточки взяты из test-сплита ДЗ 3 — его модель не видела ни в обучении,
  # ни в валидации. Оценки от 2 до 5: тон отзыва обязан им соответствовать,
  # и это самое заметное отличие адаптера от базовой модели.
  prompts:
    - "Организация: CompShop (Компьютерный магазин, Компьютерный ремонт и услуги)\nГород: Ростов-на-Дону\nОценка: 5 из 5\nУпомянуть: сдавал, чистку, сделали, работать\nНапиши отзыв от первого лица."
    - "Организация: Ренессанс (Мебель на заказ, Шкафы-купе, Мебель для кухни)\nГород: Москва\nОценка: 4 из 5\nУпомянуть: кухню, быстро, сделали, следующий\nНапиши отзыв от первого лица."
    - "Организация: S7 Airlines (Авиакомпания, Железнодорожные и авиабилеты)\nГород: Новосибирская область\nОценка: 3 из 5\nУпомянуть: второй, статусу, сильвер, другое\nНапиши отзыв от первого лица."
    - "Организация: Геоскан (Аэросъёмка, Изыскательские работы)\nГород: Москва\nОценка: 2 из 5\nУпомянуть: главное, разочарование, должна, сырая\nНапиши отзыв от первого лица."
    - "Организация: Аквамарин (Аквариумы)\nГород: Республика Татарстан\nОценка: 5 из 5\nУпомянуть: замечательный, магазин, аквариум, морской\nНапиши отзыв от первого лица."
  # Ровно тот системный промпт, под которым собирались обучающие примеры
  # в ДЗ 3. Чужой здесь означал бы расхождение шаблона обучения
  # и инференса — дефект, который ловили в ДЗ 4.
  system: "Составь отзыв посетителя об организации по её карточке. Тон отзыва должен соответствовать оценке, а перечисленные детали — встретиться в тексте. Выведи только сам отзыв."

paths:
  models: "models"
  metrics: "metrics"
  curves: "docs/curves.png"
  compare: "docs/compare.md"
